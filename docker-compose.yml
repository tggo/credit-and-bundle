services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: bc
      POSTGRES_DB: bundlecredit
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bc -d bundlecredit"]
      interval: 2s
      retries: 20
  plantuml:
    image: plantuml/plantuml-server:jetty-v1.2026.9
    ports:
      - "127.0.0.1:18095:8080"
volumes:
  pgdata:

{{define "board"}}{{template "head" .}}
<div class="boardbar">
  <a href="/board?b=changed&c={{.Customer}}" class="{{if eq .Board "changed"}}on{{end}}">Changed model</a>
  <a href="/board?b=current&c={{.Customer}}" class="{{if eq .Board "current"}}on{{end}}">Current model</a>
  <button id="regen" class="danger">Regenerate from model</button>
</div>
<div id="board"></div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.3.6/dist/style.css">
<script type="importmap">
{"imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
  "react-dom": "https://esm.sh/react-dom@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "@xyflow/react": "https://esm.sh/@xyflow/react@12.3.6?external=react,react-dom",
  "htm": "https://esm.sh/htm@3.1.1"
}}
</script>
<script type="module" src="/static/board.js?v={{.V}}"></script>
{{template "foot" .}}{{end}}
